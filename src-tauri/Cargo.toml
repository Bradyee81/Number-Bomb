[package]
name = "number-bomb"
version = "0.4.0"
description = "Live stage number-guessing game with chroma-key output"
authors = ["Brad"]
edition = "2021"

[lib]
name = "number_bomb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
espflash = { version = "3", default-features = false, features = ["serialport"] }
getrandom = "0.2"
tauri-plugin-process = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
