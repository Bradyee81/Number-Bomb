[package]
name = "number-bomb"
version = "0.1.0"
description = "Live stage number-guessing game with chroma-key output"
authors = ["Brad"]
edition = "2021"

[lib]
name = "number_bomb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
